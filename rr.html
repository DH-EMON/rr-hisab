function mkPdf(){

function add(bb){if(typeof bb=="string")bb=enc.encode(bb);parts.push(bb);len+=bb.length}
function obj(k,head,st){off[k]=len;add(k+" 0 obj\n"+head+"\n");if(st){add("stream\n");add(st);add("\nendstream\n")}add("endobj\n")}
add("%PDF-1.4\n");
obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
obj(2,"<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
obj(3,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+pw+" "+ph+"] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>");
obj(4,"<< /Type /XObject /Subtype /Image /Width "+cv.width+" /Height "+cv.height+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpg.length+" >>",jpg);
var cs="q "+pw+" 0 0 "+ph+" 0 0 cm /Im0 Do Q";
obj(5,"<< /Length "+cs.length+" >>",cs);
var xr=len;add("xref\n0 6\n0000000000 65535 f \n");
for(var z=1;z<=5;z++)add(("0000000000"+off[z]).slice(-10)+" 00000 n \n");
add("trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n"+xr+"\n%%EOF");
return new Blob(parts,{type:"application/pdf"});
}
document.getElementById("pdf").onclick=function(){try{var bl=mkPdf(),u=URL.createObjectURL(bl),a=document.createElement("a");a.href=u;a.download="RR-"+CFG.key+".pdf";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000)}catch(e){alert("PDF বানানো যায়নি।")}};
function openFs(){try{mkPdf()}catch(e){}document.getElementById("fsi").src=PVURL;document.getElementById("fs").className="fs on"}
function closeFs(){document.getElementById("fs").className="fs"}
document.getElementById("pvb").onclick=openFs;
document.getElementById("fsx").onclick=closeFs;
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeFs()});
build();
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
