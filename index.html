<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1b1f2a;--mu:#6b7280;--bd:#c9ced9;--ac:#305496;--ac2:#e8eefb;--red:#c0201a;--bad:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141a;--card:#1c1f28;--tx:#eceef4;--mu:#9aa1b2;--bd:#3a3f4e;--ac:#7ea3ee;--ac2:#232a3d;--red:#ff7b72;--bad:#f08a80}}
:root[data-theme="dark"]{--bg:#12141a;--card:#1c1f28;--tx:#eceef4;--mu:#9aa1b2;--bd:#3a3f4e;--ac:#7ea3ee;--ac2:#232a3d;--red:#ff7b72;--bad:#f08a80}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Bengali","Nirmala UI",Arial,sans-serif;padding:14px 10px 70px}
h1{font-size:20px;margin:2px 4px;text-align:center}
.sub{color:var(--mu);font-size:12px;text-align:center;margin-bottom:10px}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px}
table{border-collapse:collapse;min-width:100%}
th,td{border:1px solid var(--bd);padding:0;text-align:center;white-space:nowrap}
th{background:var(--ac2);font-size:13px;padding:6px 4px}
th input{font-weight:700;text-align:center;background:transparent;border:0;width:84px;font-size:14px}
th small{display:block;color:var(--mu);font-weight:400;font-size:11px}
td.l,th.l{position:sticky;left:0;z-index:2;background:var(--card);min-width:112px;max-width:112px;white-space:normal;text-align:left;padding:6px;font-size:12px;font-weight:600}
th.l{background:var(--ac2)}
td input{width:84px;border:0;background:transparent;color:var(--red);font:inherit;font-size:15px;text-align:center;padding:9px 4px}
td input:focus{outline:2px solid var(--ac);background:var(--ac2)}
td.v{color:var(--red);font-size:15px;padding:9px 6px;font-weight:600}
tr.t td,tr.c td{background:var(--ac2)}
td.neg{color:var(--bad)}
.gap td{height:14px;border-left:1px solid var(--bd)}
.ttl{display:flex;gap:8px;justify-content:center;margin:2px 0 6px}
.ttl select,.ttl input{font:inherit;font-size:17px;font-weight:700;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 8px}
.ttl input{width:84px;text-align:center}
.del{display:block;margin:2px auto 0;border:0;background:none;color:var(--bad);font-size:12px;padding:2px 6px;cursor:pointer}
.btns{display:flex;gap:8px;margin-top:12px}
button{font:inherit;border-radius:10px;padding:12px;cursor:pointer}
.p{flex:1;background:var(--ac);color:#fff;border:0;font-weight:600}
.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.note{color:var(--mu);font-size:12px;margin-top:12px}
.pvh{font-size:15px;margin:18px 4px 8px}
.foot{text-align:center;color:var(--mu);font-size:12px;margin-top:22px}
.pv{background:#fff}
#pv{cursor:zoom-in}
.fs{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.fs.on{display:flex}
.fs .bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-weight:700}
.fs .bar button{padding:8px 16px}
.fs .body{flex:1;overflow:auto;background:#fff}
.fs img{display:block;width:100%;min-width:900px}

<body>
<h1>RR হিসাব</h1>
<div class="ttl"><select id="mon" aria-label="মাস"></select><input id="yr" type="number" inputmode="numeric" aria-label="সাল"></div>
<div class="sub">ডানে-বামে সরিয়ে দেখুন · লাল সংখ্যায় ট্যাপ করে বদলান</div>
<div class="wrap"><table id="tb"></table></div>
<div class="btns"><button class="p" id="add">+ নতুন কলাম</button><button class="s" id="pvb">প্রিভিউ</button><button class="s" id="pdf">PDF</button><button class="s" id="rst">রিসেট</button></div>
<div class="note">ডাটা শুধু এই ফোনের ব্রাউজারে সেভ হয়। মোট গ্রহণ = আগের জের + প্রাপ্তি; জের = মোট গ্রহণ − মোট খরচ।</div>
<div class="foot">Create by Ocu Emon</div>
<div class="fs" id="fs"><div class="bar"><span>PDF প্রিভিউ</span><button class="s" id="fsx">বন্ধ ×</button></div><div class="body"><img id="fsi" alt="PDF প্রিভিউ"></div></div>
<script>
var N=["মরিচ","হলুদ","আদা","রসুন","ধনিয়া","জিরা","লবঙ্গ","দারুচিনি","এলাচ","তেজপাতা","পাঁচফোড়ন"];
var O=[13.028,22.055,9.292,11.262,6.969,2.876,2.626,3.069,1.880,1.870,1.082];
var R=[15,8,19,18,5,5,2,2,2,1,1];
var E=[22.020,22.250,22.580,25.250,5.880,4.560,1.680,2.960,1.880,0.220,0.720];
var SAMPLE=N.map(function(n,i){return{n:n,o:O[i],r:R[i],e:E[i]}});
var S=null;
try{var raw=localStorage.getItem("stock-v2");if(raw)S=JSON.parse(raw)}catch(x){}
if(!S||!S.length)S=JSON.parse(JSON.stringify(SAMPLE));
(function(){var dn=null;try{dn=localStorage.getItem("stock-clean1")}catch(x){}
if(dn)return;
var idx=-1;S.forEach(function(it,i){if(it.n==="পাঁচফোড়ন")idx=i});if(idx<0&&S.length>11)idx=10;
if(idx>=0){while(S.length>idx+1){var l=S[S.length-1];if(l.o||l.r||l.e)break;S.pop()}}
try{localStorage.setItem("stock-clean1","1")}catch(x){}
save()})();
function save(){try{localStorage.setItem("stock-v2",JSON.stringify(S))}catch(x){}}
function f(x){return (Math.round(x*1000)/1000).toFixed(3)}
function num(v){var n=parseFloat(v);return isNaN(n)?0:n}
var T=document.getElementById("tb");
function build(){
var h='<tr><th class="l">বিবরণ</th>';
S.forEach(function(it,i){h+='<th><input data-i="'+i+'" data-k="n" aria-label="নাম"><small>কেজি</small><button class="del" data-i="'+i+'">× মুছুন</button></th>'});
h+='</tr>';
var pi=(M.m+11)%12,py=M.m==0?M.y-1:M.y;
var rows=[["RR ব্যালেন্স - "+MN[pi]+" "+py,"o"],["SSD","r"],["gap"],["মোট গ্রহণ","t"],["মোট প্রদান","e"],["RR ব্যালেন্স - "+MN[M.m]+" "+M.y,"c"]];
rows.forEach(function(r){
if(r[0]=="gap"){h+='<tr class="gap"><td class="l"></td>'+S.map(function(){return"<td></td>"}).join("")+'</tr>';return}
var k=r[1];
h+='<tr class="'+(k=="t"?"t":k=="c"?"c":"")+'"><td class="l">'+r[0]+'</td>';
S.forEach(function(it,i){
if(k=="t"||k=="c")h+='<td class="v" id="'+k+i+'"></td>';
else h+='<td><input type="number" step="0.001" inputmode="decimal" data-i="'+i+'" data-k="'+k+'"></td>';
});h+='</tr>';
});
T.innerHTML=h;
T.querySelectorAll("input").forEach(function(inp){
var i=+inp.dataset.i,k=inp.dataset.k;
inp.value=S[i][k];
inp.oninput=function(){S[i][k]=k=="n"?this.value:num(this.value);calc(i);save()};
});
T.querySelectorAll(".del").forEach(function(b){b.onclick=function(){var i=+this.dataset.i;if(confirm("\""+S[i].n+"\" কলাম মুছবেন?")){S.splice(i,1);save();build()}}});
for(var j=0;j<S.length;j++)calc(j);
}
function calc(i){
var it=S[i],t=it.o+it.r,c=t-it.e;
document.getElementById("t"+i).textContent=f(t);
var ce=document.getElementById("c"+i);ce.textContent=f(c);ce.className="v"+(c<0?" neg":"");
}
document.getElementById("add").onclick=function(){S.push({n:"নতুন",o:0,r:0,e:0});save();build();document.querySelector(".wrap").scrollLeft=99999};
document.getElementById("rst").onclick=function(){if(confirm("সব ডাটা মুছে খাতার ডাটা ফিরিয়ে আনবেন?")){S=JSON.parse(JSON.stringify(SAMPLE));save();build()}};
var PVURL="",pvT=null;
function openFs(){try{mkPdf()}catch(e){}document.getElementById("fsi").src=PVURL;document.getElementById("fs").className="fs on"}
function closeFs(){document.getElementById("fs").className="fs"}
document.getElementById("pvb").onclick=openFs;
document.getElementById("fsx").onclick=closeFs;
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeFs()});
function mkPdf(){
var sc=2,lw=200,cw=96,rh=36,pad=16,n=S.length,W=pad*2+lw+n*cw,th=44,hh=40,gp=14;
var H=pad*2+th+hh+rh*5+gp+26;
var cv=document.createElement("canvas");cv.width=W*sc;cv.height=H*sc;
var x=cv.getContext("2d");x.scale(sc,sc);x.fillStyle="#fff";x.fillRect(0,0,W,H);
var FF='"Noto Sans Bengali","Nirmala UI","Segoe UI",system-ui,Arial,sans-serif';
x.textBaseline="middle";x.textAlign="center";x.fillStyle="#111";x.font="bold 20px "+FF;
x.fillText(MN[M.m]+" - "+M.y,W/2,pad+th/2);
var pi=(M.m+11)%12,py=M.m==0?M.y-1:M.y;
var defs=[["RR ব্যালেন্স - "+MN[pi]+" "+py,"o"],["SSD","r"],["মোট গ্রহণ","t"],["মোট প্রদান","e"],["RR ব্যালেন্স - "+MN[M.m]+" "+M.y,"c"]];
var y0=pad+th;
function box(a,b,w,h,fill){if(fill){x.fillStyle=fill;x.fillRect(a,b,w,h)}x.strokeStyle="#777";x.lineWidth=1;x.strokeRect(a,b,w,h)}
box(pad,y0,lw,hh,"#e8eefb");x.fillStyle="#111";x.font="bold 14px "+FF;x.fillText("বিবরণ",pad+lw/2,y0+hh/2);
S.forEach(function(it,i){var a=pad+lw+i*cw;box(a,y0,cw,hh,"#e8eefb");x.fillStyle="#111";x.font="bold 14px "+FF;x.fillText(it.n,a+cw/2,y0+hh/2-6);x.font="10px "+FF;x.fillText("কেজি",a+cw/2,y0+hh/2+10)});
defs.forEach(function(d,r){
var y=y0+hh+r*rh+(r>=2?gp:0),k=d[1],tot=(k=="t"||k=="c");
box(pad,y,lw,rh,tot?"#e8eefb":null);x.fillStyle="#111";x.font="bold 12px "+FF;x.textAlign="left";x.fillText(d[0],pad+8,y+rh/2);x.textAlign="center";
S.forEach(function(it,i){var a=pad+lw+i*cw,t=it.o+it.r,v=k=="o"?it.o:k=="r"?it.r:k=="e"?it.e:k=="t"?t:t-it.e;
box(a,y,cw,rh,tot?"#e8eefb":null);x.fillStyle=v<0?"#b42318":"#c0201a";x.font=(tot?"bold ":"")+"15px "+FF;x.fillText(f(v),a+cw/2,y+rh/2)});
});
x.fillStyle="#555";x.font="12px "+FF;x.textAlign="center";x.fillText("Create by Ocu Emon",W/2,H-pad-2);
var b64=cv.toDataURL("image/jpeg",0.92).split(",")[1];PVURL="data:image/jpeg;base64,"+b64;var bin=atob(b64),jpg=new Uint8Array(bin.length);
for(var q=0;q<bin.length;q++)jpg[q]=bin.charCodeAt(q);
var pw=842,ph=Math.round(842*H/W),enc=new TextEncoder(),parts=[],off=[],len=0;
function add(b){if(typeof b=="string")b=enc.encode(b);parts.push(b);len+=b.length}
function obj(n,head,st){off[n]=len;add(n+" 0 obj\n"+head+"\n");if(st){add("stream\n");add(st);add("\nendstream\n")}add("endobj\n")}
add("%PDF-1.4\n");
obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
obj(2,"<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
obj(3,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+pw+" "+ph+"] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>");
obj(4,"<< /Type /XObject /Subtype /Image /Width "+cv.width+" /Height "+cv.height+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpg.length+" >>",jpg);
var cs="q "+pw+" 0 0 "+ph+" 0 0 cm /Im0 Do Q";
obj(5,"<< /Length "+cs.length+" >>",cs);
var xr=len;add("xref\n0 6\n0000000000 65535 f \n");
for(var z=1;z<=5;z++)add(("0000000000"+off[z]).slice(-10)+" 00000 n \n");
add("trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n"+xr+"\n%%EOF");
return new Blob(parts,{type:"application/pdf"});
}
document.getElementById("pdf").onclick=function(){try{var bl=mkPdf(),u=URL.createObjectURL(bl),a=document.createElement("a");a.href=u;a.download="RR-hisab-"+M.y+"-"+(M.m+1)+".pdf";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000)}catch(e){alert("PDF বানানো যায়নি।")}};
var MN=["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
var M={m:8,y:2026};
try{var rm=localStorage.getItem("stock-meta");if(rm){var pm=JSON.parse(rm);if(pm&&pm.m>=0&&pm.m<12&&pm.y)M=pm}}catch(x){}
var sel=document.getElementById("mon"),yr=document.getElementById("yr");
MN.forEach(function(n,i){var o=document.createElement("option");o.value=i;o.textContent=n;sel.appendChild(o)});
sel.value=M.m;yr.value=M.y;
function sm(){try{localStorage.setItem("stock-meta",JSON.stringify(M))}catch(x){}}
sel.onchange=function(){M.m=+this.value;sm();build()};
yr.onchange=function(){var y=parseInt(this.value);if(y>1900&&y<2200){M.y=y;sm();build()}else this.value=M.y};
build();
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>

</html>
